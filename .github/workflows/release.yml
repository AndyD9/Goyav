# Build Goyav for Apple Silicon on every push to `goyav` and publish it
# as the latest GitHub release. The installed app polls
# releases/latest/download/latest.json (see plugins.updater in
# tauri.conf.json) and offers to install newer builds.
#
# Version: major.minor from tauri.conf.json, patch = workflow run number,
# so every push is newer than the last without manual bumps.
#
# Repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY     contents of ~/.tauri/goyav.key
#   CHITHI_GOOGLE_CLIENT_ID       same values as src-tauri/.cargo/config.toml,
#   CHITHI_GOOGLE_CLIENT_SECRET   or Google sign-in breaks in released builds
#
# Optional repository variables (Settings > Variables); unset keeps the
# upstream Chithi OAuth apps:
#   CHITHI_MICROSOFT_CLIENT_ID    your Entra ID public client
#   CHITHI_ZOOM_CLIENT_ID         your Zoom Marketplace app
#   CHITHI_ZOOM_REDIRECT_URI      its redirect (a bounce page you host);
#                                 the default goes through chithi.org

name: Release

on:
  push:
    branches: [goyav]
  workflow_dispatch:

# A newer push supersedes a build still in flight.
concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # The installed app auto-updates to whatever this workflow publishes, so
  # the full test suite must pass first.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  macos:
    name: Build and publish (macOS arm64)
    needs: ci
    runs-on: macos-latest
    # Signing key, its password and the OAuth client live in the "release"
    # environment, which only the goyav branch may use; other workflows and
    # branches cannot read them.
    environment: release
    steps:
      # A missing secret expands to "", which option_env! would bake in
      # as an empty OAuth client; stop before publishing such a build.
      - name: Check secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CHITHI_GOOGLE_CLIENT_ID: ${{ secrets.CHITHI_GOOGLE_CLIENT_ID }}
          CHITHI_GOOGLE_CLIENT_SECRET: ${{ secrets.CHITHI_GOOGLE_CLIENT_SECRET }}
        run: |
          missing=0
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD CHITHI_GOOGLE_CLIENT_ID CHITHI_GOOGLE_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name in the release environment"; missing=1; fi
          done
          exit $missing

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the release notes list the commits
          # since the previous release tag.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.27.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version
        run: |
          node -e '
            const fs = require("fs");
            const path = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(path, "utf8"));
            const [major, minor] = conf.version.split(".");
            conf.version = `${major}.${minor}.${process.env.GITHUB_RUN_NUMBER}`;
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + "\n");
            console.log(`Building Goyav ${conf.version}`);
          '

      # Feature, performance and fix commits since the previous release,
      # grouped under the headings src/lib/release-notes.ts reads. They are
      # the GitHub release body (shown in the in-app update notice) and are
      # baked into the build through GOYAV_RELEASE_NOTES (shown in About).
      - name: Release notes
        run: |
          prev=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          range=HEAD
          if [ -n "$prev" ]; then range="$prev..HEAD"; fi
          section() {
            lines=$(git log --no-merges --format='%s' "$range" \
              | grep -E "^($2)(\([^)]*\))?!?: " \
              | sed -E "s/^($2)(\([^)]*\))?!?: //" \
              | awk '{ print "- " toupper(substr($0, 1, 1)) substr($0, 2) }' || true)
            if [ -n "$lines" ]; then printf '### %s\n%s\n\n' "$1" "$lines"; fi
          }
          notes=$(section New feat; section Improved perf; section Fixed fix)
          if [ -z "$notes" ]; then notes="Maintenance release."; fi
          delimiter="NOTES_$(openssl rand -hex 16)"
          {
            echo "GOYAV_RELEASE_NOTES<<$delimiter"
            printf '%s\n' "$notes"
            echo "$delimiter"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$notes"

      - name: Build and release
        # Pinned to a commit like every other action: this step holds the
        # update-signing key and a contents:write token.
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CHITHI_GOOGLE_CLIENT_ID: ${{ secrets.CHITHI_GOOGLE_CLIENT_ID }}
          CHITHI_GOOGLE_CLIENT_SECRET: ${{ secrets.CHITHI_GOOGLE_CLIENT_SECRET }}
          # Optional repository variables (public client ids, not secrets).
          # Unset expands to "", which oauth.rs treats as "use the upstream
          # Chithi registration".
          CHITHI_MICROSOFT_CLIENT_ID: ${{ vars.CHITHI_MICROSOFT_CLIENT_ID }}
          CHITHI_ZOOM_CLIENT_ID: ${{ vars.CHITHI_ZOOM_CLIENT_ID }}
          CHITHI_ZOOM_REDIRECT_URI: ${{ vars.CHITHI_ZOOM_REDIRECT_URI }}
        with:
          tagName: v__VERSION__
          releaseName: Goyav v__VERSION__
          releaseBody: |
            ${{ env.GOYAV_RELEASE_NOTES }}

            Built from ${{ github.sha }}.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # --locked: fail instead of re-resolving if Cargo.lock is stale.
          args: --bundles app -- --locked
