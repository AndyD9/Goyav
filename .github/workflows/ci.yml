name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, goyav]
  # Release (push to goyav) calls this workflow and only publishes when it
  # passes, so goyav pushes are not listed above to avoid running it twice.
  workflow_call:

# Cancel superseded runs on the same ref (e.g. re-pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Vitest + vue-tsc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pcscd libpcsclite-dev pcsc-tools pkgconf

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.27.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec vue-tsc --noEmit

      - name: Test
        run: pnpm test

  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      # Tauri 2 system deps on Ubuntu. Required by the Rust build even for
      # check/clippy/test because tauri links against webkit2gtk at compile.
      # gnome-keyring + dbus-x11 are needed by the db::accounts tests, which
      # round-trip passwords through the real OS Secret Service.
      # libpcsclite-dev is needed by pcsc-sys, pulled in transitively by
      # libtumpa for OpenPGP smartcard support; its build script fails the
      # whole compile if libpcsclite.pc is missing.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libpcsclite-dev \
            build-essential \
            pkg-config \
            gnome-keyring \
            dbus-x11

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      # Some db::accounts tests store/retrieve passwords in the OS keyring,
      # so they need a D-Bus session with a usable gnome-keyring Secret
      # Service. Pattern adapted from keyring-rs' own CI:
      # - dbus-run-session provides a throwaway session bus.
      # - Removing ~/.local/share/keyrings forces a fresh login keyring.
      # - `gnome-keyring-daemon --unlock` with a non-empty password creates
      #   and unlocks the login keyring; the daemon then registers as the
      #   default Secret Service collection on the bus.
      - name: cargo test
        working-directory: src-tauri
        run: |
          dbus-run-session -- bash -c '
            rm -rf "$HOME/.local/share/keyrings"
            mkdir -p "$HOME/.local/share/keyrings"
            echo -n "test" | gnome-keyring-daemon --unlock
            cargo test --locked --all-targets
          '
