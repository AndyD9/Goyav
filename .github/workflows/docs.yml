# Build the chithi.org documentation site on every push and pull
# request, deploy to GitHub Pages on push to main. Building on
# every push (not just doc-touching ones) catches link rot and
# config drift introduced by source-only PRs that happen to break
# the build, and lets feature branches verify their docs even
# when they don't ship to production yet.
#
# The repo's Pages settings need "Source: GitHub Actions" and
# the custom domain `chithi.org` configured (DNS apex A records
# point at GitHub's Pages IPs).

name: Docs

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: only the deploy job (main only) gets Pages/OIDC rights;
# the build job runs for every push and pull request with read access.
permissions:
  contents: read

# Don't kick off two deploys at once — let the latest commit win.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Single-package install; not worth wiring `cache: pip`,
      # which would need a `requirements.txt` we'd otherwise have
      # nothing to put in. If the build slows down enough for it
      # to matter, pin via web/requirements.txt at that point.
      - run: pip install "mkdocs-material>=9,<10"
      # `--strict` turns broken links / missing nav entries into
      # build failures so a doc-rot PR fails CI before deploy.
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    # Only deploy on push to main. Feature branches and PRs
    # build-only as a guard against doc rot.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
